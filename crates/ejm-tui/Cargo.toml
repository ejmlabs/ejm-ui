[package]
name = "ejm-tui"
version = "0.1.0"
edition = "2024"
rust-version = "1.99.1"
description = "ejmlabs terminal components for ratatui: containerless text, rows, status, stats, tables, prompts and states."
license = "MIT"
publish = false

[dependencies]
pulldown-cmark = { version = "0.13", default-features = false }
ratatui = { version = "0.30", default-features = false }
strum = { version = "0.28", features = ["derive"] }
textwrap = { version = "0.16", default-features = false, features = ["unicode-width"] }
unicode-segmentation = "1"
# The series ratatui 0.30 uses, so consumers build one copy.
unicode-truncate = "3"
unicode-width = "0.2"

[dev-dependencies]
serde_json = "1"

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
