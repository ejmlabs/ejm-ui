name: Rust test reliability
on:
  push:
    branches: [main]
  schedule:
    - cron: '59 11 * * *'
permissions:
  contents: read
env:
  CARGO_BUILD_JOBS: 2
  CARGO_INCREMENTAL: 0
jobs:
  reliability:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - run: rustup toolchain install 1.99.1 --profile minimal && rustup default 1.99.1
      - name: Install verified cargo-nextest
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/cargo-nextest.tar.gz"
          bindir="$RUNNER_TEMP/nextest-bin"
          curl --fail --silent --show-error --location --proto '=https' --proto-redir '=https' \
            https://github.com/nextest-rs/nextest/releases/download/cargo-nextest-0.9.124/cargo-nextest-0.9.124-x86_64-unknown-linux-gnu.tar.gz \
            --output "$archive"
          printf '%s  %s\n' cf3694155011e6e19a7306448b7984e5d0d781417a31478996a9018b7ec78e25 "$archive" | shasum -a 256 --check --status
          mkdir "$bindir"
          tar -xzf "$archive" -C "$bindir" cargo-nextest
          "$bindir/cargo-nextest" --version
          echo "$bindir" >> "$GITHUB_PATH"
      - run: python3 -B -m unittest discover -s scripts -p 'test_flake_check.py'
      - name: Compare Rust test runs
        working-directory: crates/ejm-tui
        run: python3 ../../scripts/flake_check.py "$RUNNER_TEMP/ui-rust-flakes"
