name: Human-admitted PR checks
on:
  issue_comment:
    types: [created, edited, deleted]
  pull_request_target:
    types: [unlabeled]
permissions: {}
jobs:
  governance:
    if: ${{ github.event.issue.pull_request || github.event_name == 'pull_request_target' }}
    permissions:
      contents: read
      pull-requests: write
      statuses: write
      actions: write
    uses: ejmlabs/.github/.github/workflows/governance.yml@c75f37d4aa7da5a219c599fea06ab1799691cbf7
    secrets:
      XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
      EJM_HARNESS_TOKEN: ${{ secrets.EJM_HARNESS_TOKEN }}
