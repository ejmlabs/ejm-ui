version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    cooldown:
      default-days: 7
    groups:
      compatible-updates:
        update-types: [minor, patch]
    ignore:
      # The ejmlabs/.github caller pins move only by hand, all of them in one pull request with the community files and skills.
      - dependency-name: "ejmlabs/.github"
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    cooldown:
      default-days: 7
    groups:
      compatible-updates:
        update-types: [minor, patch]
  - package-ecosystem: "cargo"
    directory: "/crates/ejm-tui"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    cooldown:
      default-days: 7
    groups:
      compatible-updates:
        update-types: [minor, patch]
