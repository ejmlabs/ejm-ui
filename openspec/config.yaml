schema: spec-driven

context: |
  ejm-ui is the ejmlabs design system. Products consume the public @ejm/* exports. The sibling repositories ejm-cli, ejm-ide, and ejm-harness are not part of this repo. Leave their product behavior there. Do not copy private sibling source into a package.
  npm workspaces cover packages/*, apps/*, and examples/*. The eight owned packages stay private: @ejm/tokens (theme.json and the generators for CSS, Tailwind, Rust, Monaco, and terminal themes), @ejm/ui (React components, hooks, layouts, views, styles, and art), @ejm/core (framework-neutral contract in contract.json, state machines in src/machine.ts, and formatting in src/format.ts; no React, Ink, or DOM), @ejm/ink (Ink terminal components), @ejm/demos (scenario data and lazy demo islands), @ejm/site (shared site head, project registry, analytics, and security headers), @ejm/ssg (prerenders every Vite and React route to static HTML), and @ejm/shots (product capture metadata, exports, and optimized images). @ejm/gallery in apps/gallery is the gallery and docs site. examples/starter (@ejm/starter) is the reference site consumer.
  crates/ejm-tui is the Ratatui target and is not published to crates.io. It uses Rust 1.99.1, edition 2024, and ratatui 0.30 with default features off. It follows packages/core/contract.json and the generated theme. Do not hand-edit crates/ejm-tui/src/theme.rs or other generated theme output. Change theme.json or the generator, then refresh the token outputs and run node scripts/sync-rust-theme.mjs so the crate copy matches. npm run check compares the Rust theme with node scripts/sync-rust-theme.mjs --check.
  Tooling is strict TypeScript, Vite, Tailwind CSS v4, and Vitest in jsdom. The only UI runtime is real React 19 and react-dom. Do not add Preact or a compat alias. Site routing is wouter inside @ejm/ssg. @ejm/ui links stay router-agnostic. shadcn/ui components are copied in as source and edited here. The shared check recipe uses Node.js 24. Vite needs at least Node.js 22.12. Rustfmt and Clippy cover ejm-tui. This repo has no ESLint, Prettier, or Biome config. Browser and capture checks need Google Chrome, or CHROME set to a Chrome binary. On Linux, Python and C/C++ build tools must be present so the locked node-pty can compile before tests. That named rebuild is the only dependency lifecycle exception.
  Commands: npm run check runs the em dash scan, retained-asset check, generated-theme check, strict contract parity, workspace package checks, tsc, and Vitest. npm test is vitest run. npm run typecheck is tsc -p tsconfig.json. npm run build builds every workspace that defines a build. npm run dev serves the gallery and does not deploy it. npm run check:rust, in crates/ejm-tui, is cargo test, then cargo clippy --all-targets -- -D warnings, then cargo fmt --check. npm run perf measures first contentful paint per route in Lighthouse; there are no size budgets. node scripts/pack-proof.mjs checks packed tarball interfaces and does not publish. Run it before changing an export, manifest, or package file list.
  Conventions: brand fonts are Manrope and IBM Plex Mono only. The palette comes from packages/tokens. Never add a color outside it. No cards, panels, tiles, or tonal boxes. Group with type, space, hairline rows, and full-bleed bands. Only product windows, menus, and overlays have a shadow. Motion is transform and opacity only and must show the final state under reduced motion. No em dashes in any file. A test must protect a behavior, a contract, or a regression. Do not publish, deploy, or push without the owner's approval.

rules:
  proposal:
    - Name the packages, the gallery, the starter, or crates/ejm-tui that the change touches, and state what is out of scope.
    - Leave behavior that belongs to ejm-cli, ejm-ide, or ejm-harness in those repositories.
  specs:
    - Specify observable behavior and the existing check that would fail if it regressed.
    - Add or change a delta spec only for behavior this change introduces or alters. Main specs under openspec/specs/ update at sync or archive.
  design:
    - Keep the containerless design language, the token palette, and the two brand fonts.
    - Use real React 19 and react-dom. Do not introduce a second UI runtime.
    - Do not hand-edit generated theme files. Change theme.json or the generator, then refresh the token outputs and run node scripts/sync-rust-theme.mjs so the crate copy matches.
  tasks:
    - Point each code task at the narrowest existing check, then at npm run check or npm run check:rust.
    - Include node scripts/pack-proof.mjs when an export, manifest, or package file list changes.

operations:
  apply:
    guidance:
      - Run the focused check for the files you edit before the full gate.
      - Run npm run check before calling TypeScript, token, asset, or docs work done.
      - Run npm run check:rust before calling crates/ejm-tui work done.
  archive:
    guidance:
      - State which checks ran and which did not.
      - Sync delta specs into openspec/specs/ only for behavior this change introduced or altered.
